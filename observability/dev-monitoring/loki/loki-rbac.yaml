---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loki-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: loki-cluster-role
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "services", "endpoints", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: loki-cluster-role-binding
subjects:
  - kind: ServiceAccount
    name: loki-sa
roleRef:
  kind: ClusterRole
  name: loki-cluster-role
  apiGroup: rbac.authorization.k8s.io
