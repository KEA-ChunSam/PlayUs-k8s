apiVersion: apps/v1
kind: Deployment
metadata:
  name: match-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: match-service
  template:
    metadata:
      labels:
        app: match-service
    spec:
      containers:
        - name: match-service
          image: yukyung0/playus-match-service:latest
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: "300m"
              memory: "512Mi"
            limits:
              cpu: "600m"
              memory: "1Gi"
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://playus-monitoring-alloy.dev-monitoring.svc.cluster.local:4318"
            - name: OTEL_SERVICE_NAME
              value: "match-service"