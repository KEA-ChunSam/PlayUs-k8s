apiVersion: apps/v1
kind: Deployment
metadata:
  name: community-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: community-service
  template:
    metadata:
      labels:
        app: community-service
      # Prometheus 메트릭 수집을 위한 어노테이션 추가
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: community-service
          image: yukyung0/playus-community-service:latest
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: "300m"
              memory: "512Mi"
            limits:
              cpu: "600m"
              memory: "1Gi"
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://playus-monitoring-alloy.dev-monitoring.svc.cluster.local:4317"
            - name: OTEL_SERVICE_NAME
              value: "community-service"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.name=community-service,service.version=1.0.0,deployment.environment=dev"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_METRICS_EXPORTER
              value: "none"
            - name: OTEL_LOGS_EXPORTER
              value: "none"
#            - name: JAVA_TOOL_OPTIONS
#              value: "-javaagent:/app/opentelemetry-javaagent.jar"
