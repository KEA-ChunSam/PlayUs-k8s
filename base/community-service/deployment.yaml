apiVersion: apps/v1
kind: Deployment
metadata:
  name: community-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: community-service
  template:
    metadata:
      labels:
        app: community-service
    spec:
      containers:
        - name: community-service
          image: yukyung0/playus-community-service:latest
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:             # 최소 보장 리소스
              cpu: "100m"
              memory: "128Mi"
            limits:               # 최대 허용 리소스
              cpu: "200m"
              memory: "256Mi"
