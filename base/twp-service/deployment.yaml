apiVersion: apps/v1
kind: Deployment
metadata:
  name: twp-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: twp-service
  template:
    metadata:
      labels:
        app: twp-service
    spec:
      containers:
        - name: twp-service
          image: yukyung0/playus-twp-service:latest
          ports:
            - containerPort: 8080
              name: http
