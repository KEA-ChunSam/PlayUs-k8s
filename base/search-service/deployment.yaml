apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: search-service
  template:
    metadata:
      labels:
        app: search-service
    spec:
      containers:
        - name: search-service
          image: yukyung0/playus-search-service:latest
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests: # 최소 보장 리소스
              cpu: "100m"
              memory: "128Mi"
            limits: # 최대 허용 리소스
              cpu: "200m"
              memory: "256Mi"
