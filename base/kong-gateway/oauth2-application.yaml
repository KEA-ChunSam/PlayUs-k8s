# OAuth2 Application 등록
apiVersion: v1
kind: ConfigMap
metadata:
  name: oauth2-setup
data:
  setup.sh: |
    #!/bin/bash
    # OAuth2 애플리케이션 등록
    curl -X POST http://kong-cp-admin:8001/consumers/admin-user/oauth2 \
        --data "name=admin-app" \
        --data "client_id=admin-client-id" \
        --data "client_secret=admin-client-secret" \
        --data "redirect_uris=http://localhost:3000/callback"
