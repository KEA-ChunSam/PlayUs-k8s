apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-gateway-config
  namespace: dev-infra
data:
  nginx.conf: |
    worker_processes auto;

    events {
      worker_connections 1024;
    }

    http {
      # 각 서비스 upstream 정의
      # <service-name>.<namespace>.svc.cluster.local
    
      upstream auth_service {
        server auth-service.dev-infra.svc.cluster.local:8080;
      }

      upstream user_service {
        server user-service.dev-infra.svc.cluster.local:8080;
      }

      upstream community_service {
        server community-service.dev-infra.svc.cluster.local:8080;
      }

      upstream match_service {
        server match-service.dev-infra.svc.cluster.local:8080;
      }

      upstream search_service {
        server search-service.dev-infra.svc.cluster.local:8080;
      }

      upstream twp_service {
        server twp-service.dev-infra.svc.cluster.local:8080;
      }

      # 인증 검증용 내부 서버
      server {
        listen 8081;

        location /auth/verify {
          proxy_pass http://auth_service/auth/verify;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }
      }

      # 메인 API 게이트웨이 서버
      server {
        listen 80;

        # 인증 없이 접근 가능한 auth 엔드포인트
        location /auth/ {
          proxy_pass http://auth_service/auth/;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 인증 필요한 엔드포인트
        location /api/ {
          # 토큰 검증 요청
          auth_request /auth-validate;

          # 인증 서비스의 응답 헤더에서 토큰 가져오기
          auth_request_set $auth_token $upstream_http_x_auth_token;
          auth_request_set $auth_user_id $upstream_http_x_user_id;

          # 실제 서비스로 라우팅
          location /api/users/ {
            proxy_pass http://user_service/api/users/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Auth-Token $auth_token;
            proxy_set_header X-User-Id $auth_user_id;
          }

          location /api/community/ {
            proxy_pass http://community_service/api/community/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Auth-Token $auth_token;
            proxy_set_header X-User-Id $auth_user_id;
          }

          location /api/match/ {
            proxy_pass http://match_service/api/match/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Auth-Token $auth_token;
            proxy_set_header X-User-Id $auth_user_id;
          }

          location /api/search/ {
            proxy_pass http://search_service/api/search/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Auth-Token $auth_token;
            proxy_set_header X-User-Id $auth_user_id;
          }

          location /api/twp/ {
            proxy_pass http://twp_service/api/twp/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Auth-Token $auth_token;
            proxy_set_header X-User-Id $auth_user_id;
          }
        }

        # 인증 검증 내부 엔드포인트
        location = /auth-validate {
          internal;
          proxy_pass http://127.0.0.1:8081/auth/verify;
          proxy_pass_request_body off;
          proxy_set_header Content-Length "";
          proxy_set_header X-Original-URI $request_uri;
          proxy_set_header Authorization $http_authorization;
        }
      }
    }
