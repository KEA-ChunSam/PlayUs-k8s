global:
  namespace: dev-monitoring

loki:
  enabled: true
  deploymentMode: SingleBinary

  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      size: 10Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi
    nodeSelector:
      kubernetes.io/hostname: host-10-10-17-253

  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0

  loki:
    auth_enabled: false
    storage:
      type: filesystem
      bucketNames:
        chunks: dummy-chunks
        ruler: dummy-ruler
        admin: dummy-admin
    schemaConfig:
      configs:
        - from: "2024-01-01"
          store: boltdb-shipper
          object_store: filesystem
          schema: v11
          index:
            prefix: index_
            period: 24h
    limits_config:
      retention_period: 168h
      ingestion_rate_mb: 16
      ingestion_burst_size_mb: 32
      max_streams_per_user: 10000

grafana:
  enabled: true
  replicas: 1
  adminUser: admin
  adminPassword: "playus-dev-2024!"
  persistence:
    enabled: true
    size: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  nodeSelector:
    kubernetes.io/hostname: host-10-10-17-253
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Loki
          type: loki
          access: proxy
          url: http://playus-monitoring-loki:3100
          isDefault: true
        - name: Tempo
          type: tempo
          access: proxy
          url: http://playus-monitoring-tempo:3100
        - name: Mimir
          type: prometheus
          access: proxy
          url: http://playus-monitoring-mimir-query-frontend:8080/prometheus

tempo:
  enabled: true
  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      size: 10Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi
    nodeSelector:
      kubernetes.io/hostname: host-10-10-17-253
  tempo:
    storage:
      trace:
        backend: local
        local:
          path: /var/tempo/traces
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

mimir:
  enabled: true
  deploymentMode: SingleBinary

  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      size: 20Gi
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi
    nodeSelector:
      kubernetes.io/hostname: host-10-10-17-253

  ingester:
    nodeSelector:
      kubernetes.io/hostname: host-10-10-17-253

  alertmanager:
    nodeSelector:
      kubernetes.io/hostname: host-10-10-17-253

  compactor:
    nodeSelector:
      kubernetes.io/hostname: host-10-10-17-253

  ruler:
    nodeSelector:
      kubernetes.io/hostname: host-10-10-17-253

  store_gateway:
    nodeSelector:
      kubernetes.io/hostname: host-10-10-17-253

  mimir:
    structuredConfig:
      multitenancy_enabled: false

alloy:
  enabled: true
  replicaCount: 1
  serviceAccount:
    create: true
  rbac:
    create: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  nodeSelector:
    kubernetes.io/hostname: host-10-10-17-253
  alloy:
    configMap:
      create: true
      content: |
        loki.write "default" {
          endpoint {
            url = "http://playus-monitoring-loki:3100/loki/api/v1/push"
          }
        }

        prometheus.remote_write "default" {
          endpoint {
            url = "http://playus-monitoring-mimir-distributor:8080/api/v1/push"
          }
        }

        otelcol.exporter.otlp "default" {
          client {
            endpoint = "http://playus-monitoring-tempo:4317"
            tls {
              insecure = true
            }
          }
        }

        discovery.kubernetes "pods" {
          role = "pod"
        }

        otelcol.receiver.otlp "default" {
          grpc {
            endpoint = "0.0.0.0:4317"
          }
          http {
            endpoint = "0.0.0.0:4318"
          }
          output {
            traces = [otelcol.exporter.otlp.default.input]
          }
        }

        loki.source.kubernetes "default" {
          targets = discovery.kubernetes.pods.targets
          forward_to = [loki.write.default.receiver]
        }

        prometheus.exporter.self "default" {}

        prometheus.scrape "default" {
          targets = prometheus.exporter.self.default.targets
          forward_to = [prometheus.remote_write.default.receiver]
        }
