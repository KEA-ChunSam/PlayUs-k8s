global:
  namespace: dev-monitoring

loki:
  enabled: true
  deploymentMode: SingleBinary

  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      size: 10Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi

  # 다른 모드들 명시적으로 비활성화
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0
  ingester:
    replicas: 0
  distributor:
    replicas: 0
  querier:
    replicas: 0
  queryFrontend:
    replicas: 0
  queryScheduler:
    replicas: 0
  compactor:
    replicas: 0
  indexGateway:
    replicas: 0
  ruler:
    replicas: 0

  loki:
    auth_enabled: false
    storage:
      type: filesystem
    schemaConfig:
      configs:
        # ✅ 기존 v11 스키마 유지 (structured metadata 비활성화로 인해 가능)
        - from: "2024-01-01"
          store: boltdb-shipper  # ✅ 기존 설정 유지
          object_store: filesystem
          schema: v11            # ✅ 기존 설정 유지
          index:
            prefix: index_
            period: 24h
    limits_config:
      retention_period: 168h
      ingestion_rate_mb: 16
      ingestion_burst_size_mb: 32
      max_streams_per_user: 10000
      # ✅ structured metadata 비활성화 (v11 스키마 유지 가능)
      allow_structured_metadata: false
      # ✅ 추가 설정
      max_line_size: 256000
      max_query_parallelism: 16

grafana:
  enabled: true
  replicas: 1
  adminUser: admin
  adminPassword: "playus-dev"
  persistence:
    enabled: true
    size: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # ✅ 환경변수 추가
  env:
    GF_FEATURE_TOGGLES_ENABLE: "traceqlEditor"
    GF_INSTALL_PLUGINS: "grafana-clock-panel,grafana-simple-json-datasource"

  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Loki
          type: loki
          access: proxy
          url: http://playus-monitoring-loki:3100
          isDefault: true
          # ✅ 로그-트레이스 연동 설정
          jsonData:
            derivedFields:
              - name: "trace_id"
                matcherRegex: "\\[([^,]+),[^\\]]*\\]"
                url: "$${__value.raw}"
                datasourceUid: tempo
        - name: Tempo
          type: tempo
          access: proxy
          url: http://playus-monitoring-tempo:3100
          uid: tempo
          # ✅ 트레이스-로그 연동 설정
          jsonData:
            tracesToLogs:
              datasourceUid: loki
              filterByTraceID: true
              filterBySpanID: true
        - name: Mimir
          type: prometheus
          access: proxy
          url: http://playus-monitoring-mimir-query-frontend:8080/prometheus
          jsonData:
            exemplars: true

tempo:
  enabled: true
  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      size: 10Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi
  tempo:
    storage:
      trace:
        backend: local
        local:
          path: /var/tempo/traces
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    # ✅ 쿼리 설정 추가
    query_frontend:
      search:
        max_duration: 24h
    # ✅ 압축 설정 추가
    compactor:
      compaction:
        block_retention: 48h

mimir:
  enabled: true
  deploymentMode: SingleBinary
  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      size: 20Gi
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi
  mimir:
    structuredConfig:
      multitenancy_enabled: false
      # ✅ 추가 설정
      server:
        http_listen_port: 8080
        grpc_listen_port: 9095
      limits:
        ingestion_rate: 100000
        ingestion_burst_size: 200000

alloy:
  enabled: true
  replicaCount: 1
  serviceAccount:
    create: true
  rbac:
    create: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  alloy:
    configMap:
      create: true
      content: |
        // ✅ Loki 로그 전송
        loki.write "default" {
          endpoint {
            url = "http://playus-monitoring-loki:3100/loki/api/v1/push"
          }
        }

        // ✅ Prometheus 메트릭 전송
        prometheus.remote_write "default" {
          endpoint {
            url = "http://playus-monitoring-mimir-distributor:8080/api/v1/push"
          }
        }

        // ✅ OpenTelemetry 트레이스 전송
        otelcol.exporter.otlp "default" {
          client {
            endpoint = "http://playus-monitoring-tempo:4317"
            tls {
              insecure = true
            }
          }
        }

        // ✅ Kubernetes Pod 발견 (모든 네임스페이스)
        discovery.kubernetes "pods" {
          role = "pod"
        }

        // ✅ Pod 메트릭 수집을 위한 relabeling 설정
        discovery.relabel "pod_metrics" {
          targets = discovery.kubernetes.pods.targets

          // prometheus.io/scrape=true 어노테이션이 있는 Pod만 선택
          rule {
            source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_scrape"]
            action = "keep"
            regex = "true"
          }

          // 메트릭 경로 설정 (기본값: /metrics)
          rule {
            source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_path"]
            action = "replace"
            target_label = "__metrics_path__"
            regex = "(.+)"
          }

          // 포트 설정
          rule {
            source_labels = ["__address__", "__meta_kubernetes_pod_annotation_prometheus_io_port"]
            action = "replace"
            target_label = "__address__"
            regex = "([^:]+)(?::\\d+)?;(\\d+)"
            replacement = "$1:$2"
          }

          // 네임스페이스 라벨 추가
          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            action = "replace"
            target_label = "namespace"
          }

          // Pod 이름 라벨 추가
          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            action = "replace"
            target_label = "pod"
          }

          // 앱 라벨 추가
          rule {
            source_labels = ["__meta_kubernetes_pod_label_app"]
            action = "replace"
            target_label = "app"
          }

          // Job 라벨 생성 (namespace/app 형태)
          rule {
            source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_label_app"]
            action = "replace"
            target_label = "job"
            separator = "/"
            regex = "(.+);(.+)"
            replacement = "$1/$2"
          }
        }

        // ✅ Pod 메트릭 스크래핑
        prometheus.scrape "pod_metrics" {
          targets = discovery.relabel.pod_metrics.output
          forward_to = [prometheus.remote_write.default.receiver]
        
          scrape_interval = "30s"
          scrape_timeout = "10s"
        
          // 실패한 스크래핑도 기록
          honor_labels = true
        }

        // ✅ OpenTelemetry 트레이스 수신
        otelcol.receiver.otlp "default" {
          grpc {
            endpoint = "0.0.0.0:4317"
          }
          http {
            endpoint = "0.0.0.0:4318"
          }
          output {
            traces = [otelcol.exporter.otlp.default.input]
          }
        }

        // ✅ Kubernetes 로그 수집
        loki.source.kubernetes "default" {
          targets = discovery.kubernetes.pods.targets
          forward_to = [loki.write.default.receiver]
        }

        // ✅ Alloy 자체 메트릭 수집
        prometheus.exporter.self "default" {}

        prometheus.scrape "alloy_self" {
          targets = prometheus.exporter.self.default.targets
          forward_to = [prometheus.remote_write.default.receiver]
        }
