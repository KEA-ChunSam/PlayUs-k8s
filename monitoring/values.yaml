# =================================================
# PlayUs 모니터링 스택 Values (단순화 버전)
# Loki Chart 기본값 최대 활용
# =================================================

global:
  namespace: dev-monitoring

# =================================================
# L - Loki (로그 저장소) - 최소 설정
# =================================================
loki:
  enabled: true
  deploymentMode: SingleBinary

  singleBinary:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi
    persistence:
      enabled: true
      size: 10Gi

  # 🔧 Loki 설정 - 기본값 활용
  loki:
    auth_enabled: false

    # 🆕 기본 스키마 사용
    useTestSchema: true

    # 🆕 간단한 제한 설정만
    limits_config:
      retention_period: 168h
      ingestion_rate_mb: 16
      ingestion_burst_size_mb: 32
      max_streams_per_user: 10000

# =================================================
# G - Grafana (시각화)
# =================================================
grafana:
  enabled: true
  replicas: 1

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  adminUser: admin
  adminPassword: "playus-dev-2024!"

  # 기본 데이터소스 설정
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Loki
          type: loki
          access: proxy
          url: http://playus-monitoring-loki:3100
          isDefault: true
        - name: Tempo
          type: tempo
          access: proxy
          url: http://playus-monitoring-tempo:3100
        - name: Mimir
          type: prometheus
          access: proxy
          url: http://playus-monitoring-mimir-query-frontend:8080/prometheus

  persistence:
    enabled: true
    size: 2Gi

# =================================================
# T - Tempo (트레이스 저장소) - 기본 설정
# =================================================
tempo:
  enabled: true

  tempo:
    # 🔧 기본 설정 사용
    storage:
      trace:
        backend: local
        local:
          path: /var/tempo/traces

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

  # SingleBinary 모드 설정
  singleBinary:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi
    persistence:
      enabled: true
      size: 10Gi

# =================================================
# M - Mimir (메트릭 저장소) - 기본 설정
# =================================================
mimir:
  enabled: true
  deploymentMode: SingleBinary

  singleBinary:
    replicas: 1
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi
    persistence:
      enabled: true
      size: 20Gi

  # 🔧 기본 설정 사용
  mimir:
    structuredConfig:
      multitenancy_enabled: false

# =================================================
# Alloy (통합 수집기) - 단순 설정
# =================================================
alloy:
  enabled: true
  replicaCount: 1

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

  serviceAccount:
    create: true
  rbac:
    create: true

  alloy:
    configMap:
      create: true
      content: |
        // 단순 Alloy 설정
        
        // Loki Write
        loki.write "default" {
          endpoint {
            url = "http://playus-monitoring-loki:3100/loki/api/v1/push"
          }
        }

        // Mimir Write
        prometheus.remote_write "default" {
          endpoint {
            url = "http://playus-monitoring-mimir-distributor:8080/api/v1/push"
          }
        }

        // Tempo Write
        otelcol.exporter.otlp "default" {
          client {
            endpoint = "http://playus-monitoring-tempo:4317"
            tls {
              insecure = true
            }
          }
        }

        // Kubernetes Discovery
        discovery.kubernetes "pods" {
          role = "pod"
        }

        // 트레이스 수집
        otelcol.receiver.otlp "default" {
          grpc {
            endpoint = "0.0.0.0:4317"
          }
          http {
            endpoint = "0.0.0.0:4318"
          }
          output {
            traces = [otelcol.exporter.otlp.default.input]
          }
        }

        // 로그 수집
        loki.source.kubernetes "default" {
          targets = discovery.kubernetes.pods.targets
          forward_to = [loki.write.default.receiver]
        }

        // Alloy 자체 모니터링
        prometheus.exporter.self "default" {}
        prometheus.scrape "default" {
          targets = prometheus.exporter.self.default.targets
          forward_to = [prometheus.remote_write.default.receiver]
        }
