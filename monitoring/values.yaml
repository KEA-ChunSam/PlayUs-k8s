global:
  namespace: dev-monitoring

loki:
  enabled: true
  deploymentMode: SingleBinary

  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      size: 10Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi

  commonConfig:
    replication_factor: 1

  memberlist:
    join_members:
      - playus-monitoring-loki-headless.dev-monitoring.svc.cluster.local

  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0
  ingester:
    replicas: 0
  distributor:
    replicas: 0
  querier:
    replicas: 0
  queryFrontend:
    replicas: 0
  queryScheduler:
    replicas: 0
  compactor:
    replicas: 0
  indexGateway:
    replicas: 0
  ruler:
    replicas: 0

  loki:
    auth_enabled: false
    storage:
      type: filesystem
    schemaConfig:
      configs:
        - from: "2024-01-01"
          store: boltdb-shipper
          object_store: filesystem
          schema: v11
          index:
            prefix: index_
            period: 24h
    limits_config:
      retention_period: 168h
      ingestion_rate_mb: 16
      ingestion_burst_size_mb: 32
      max_streams_per_user: 10000
      allow_structured_metadata: false
      max_line_size: 256000
      max_query_parallelism: 16

grafana:
  enabled: true
  replicas: 1
  adminUser: admin
  adminPassword: "playus-dev"
  persistence:
    enabled: true
    size: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    GF_FEATURE_TOGGLES_ENABLE: "traceqlEditor"
    GF_INSTALL_PLUGINS: "grafana-clock-panel,grafana-simple-json-datasource"
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Loki
          type: loki
          access: proxy
          url: http://playus-monitoring-loki:3100
          isDefault: true
          jsonData:
            derivedFields:
              - name: "trace_id"
                matcherRegex: "\\[([^,]+),[^\\]]*\\]"
                url: "$${__value.raw}"
                datasourceUid: tempo
        - name: Tempo
          type: tempo
          access: proxy
          url: http://playus-monitoring-tempo:3100
          uid: tempo
          jsonData:
            tracesToLogs:
              datasourceUid: loki
              filterByTraceID: true
              filterBySpanID: true
        - name: Mimir
          type: prometheus
          access: proxy
          url: http://playus-monitoring-mimir-query-frontend:8080/prometheus
          jsonData:
            exemplars: true

tempo:
  enabled: true
  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      size: 10Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi
  tempo:
    storage:
      trace:
        backend: local
        local:
          path: /var/tempo/traces
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    query_frontend:
      search:
        max_duration: 24h
    compactor:
      compaction:
        block_retention: 48h

mimir:
  enabled: true
  deploymentMode: SingleBinary
  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      size: 20Gi
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi
  mimir:
    structuredConfig:
      multitenancy_enabled: false
      server:
        http_listen_port: 8080
        grpc_listen_port: 9095
      limits:
        ingestion_rate: 100000
        ingestion_burst_size: 200000

alloy:
  enabled: true
  replicaCount: 1
  serviceAccount:
    create: true
  rbac:
    create: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  alloy:
    configMap:
      create: true
      content: |
        loki.write "default" {
          endpoint {
            url = "http://playus-monitoring-loki:3100/loki/api/v1/push"
          }
        }

        prometheus.remote_write "default" {
          endpoint {
            url = "http://playus-monitoring-mimir-distributor:8080/api/v1/push"
          }
        }

        otelcol.exporter.otlp "default" {
          client {
            endpoint = "http://playus-monitoring-tempo:4317"
            tls {
              insecure = true
            }
          }
        }

        discovery.kubernetes "pods" {
          role = "pod"
        }

        discovery.relabel "pod_metrics" {
          targets = discovery.kubernetes.pods.targets

          rule {
            source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_scrape"]
            action = "keep"
            regex = "true"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_path"]
            action = "replace"
            target_label = "__metrics_path__"
            regex = "(.+)"
          }

          rule {
            source_labels = ["__address__", "__meta_kubernetes_pod_annotation_prometheus_io_port"]
            action = "replace"
            target_label = "__address__"
            regex = "([^:]+)(?::\\d+)?;(\\d+)"
            replacement = "$1:$2"
          }

          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            action = "replace"
            target_label = "namespace"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            action = "replace"
            target_label = "pod"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_label_app"]
            action = "replace"
            target_label = "app"
          }

          rule {
            source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_label_app"]
            action = "replace"
            target_label = "job"
            separator = "/"
            regex = "(.+);(.+)"
            replacement = "$1/$2"
          }
        }

        prometheus.scrape "pod_metrics" {
          targets = discovery.relabel.pod_metrics.output
          forward_to = [prometheus.remote_write.default.receiver]
          scrape_interval = "30s"
          scrape_timeout = "10s"
          honor_labels = true
        }

        otelcol.receiver.otlp "default" {
          grpc {
            endpoint = "0.0.0.0:4317"
          }
          http {
            endpoint = "0.0.0.0:4318"
          }
          output {
            traces = [otelcol.exporter.otlp.default.input]
          }
        }

        loki.source.kubernetes "default" {
          targets = discovery.kubernetes.pods.targets
          forward_to = [loki.write.default.receiver]
        }

        prometheus.exporter.self "default" {}

        prometheus.scrape "alloy_self" {
          targets = prometheus.exporter.self.default.targets
          forward_to = [prometheus.remote_write.default.receiver]
        }
