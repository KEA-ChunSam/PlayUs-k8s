apiVersion: v2
name: playus-monitoring
description: PlayUs 모니터링 스택 (LGTM Stack + Alloy)
version: 1.0.0
appVersion: "1.0.0"

# LGTM Stack 의존성
dependencies:
  # Loki
  - name: loki
    version: "6.21.0"
    repository: "https://grafana.github.io/helm-charts"
    condition: loki.enabled

  # Grafana
  - name: grafana
    version: "8.8.2"
    repository: "https://grafana.github.io/helm-charts"
    condition: grafana.enabled

  # Tempo
  - name: tempo
    version: "1.17.1"
    repository: "https://grafana.github.io/helm-charts"
    condition: tempo.enabled

  # Mimir
  - name: mimir-distributed
    version: "5.7.0"
    repository: "https://grafana.github.io/helm-charts"
    condition: mimir.enabled
    alias: mimir

  # Alloy
  - name: alloy
    version: "0.9.2"
    repository: "https://grafana.github.io/helm-charts"
    condition: alloy.enabled

maintainers:
  - name: PlayUs Team
    email: team@playus.com

keywords:
  - observability
  - monitoring
  - lgtm-stack
  - kubernetes
  - grafana
  - tempo
  - traces
