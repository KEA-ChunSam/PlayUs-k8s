apiVersion: v2
name: playus-monitoring
description: PlayUs 모니터링 스택 (LGTM Stack + Alloy)
version: 1.0.0
appVersion: "1.0.0"

# LGTM Stack 의존성
dependencies:
  # L - Loki (로그)
  - name: loki
    version: "6.21.0"
    repository: "https://grafana.github.io/helm-charts"
    condition: loki.enabled

  # G - Grafana
  - name: grafana
    version: "8.8.2"
    repository: "https://grafana.github.io/helm-charts"
    condition: grafana.enabled

  # T - Tempo (트레이스)
  - name: tempo
    version: "1.9.0"
    repository: "https://grafana.github.io/helm-charts"
    condition: tempo.enabled

  # M - Mimir (메트릭)
  - name: mimir-distributed
    version: "5.4.0"
    repository: "https://grafana.github.io/helm-charts"
    condition: mimir.enabled
    alias: mimir

  # Alloy
  - name: alloy
    version: "0.9.2"
    repository: "https://grafana.github.io/helm-charts"
    condition: alloy.enabled

keywords:
  - observability
  - monitoring
  - lgtm-stack
  - kubernetes
  - grafana
  - tempo
  - traces
