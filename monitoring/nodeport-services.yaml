# Grafana NodePort

apiVersion: v1
kind: Service
metadata:
  name: grafana-nodeport
  namespace: dev-monitoring
  labels:
    app: grafana
    component: monitoring
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: playus-monitoring
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30300
---
# 접속 정보:
# URL: http://bastion-ip:10006  (bastion port forwarding)
# ID: admin
# PW: playus-dev
