apiVersion: v1
kind: Service
metadata:
  name: dev-mongo-read
  namespace: dev-db
spec:
  type: ClusterIP
  ports:
    - port: 27017
      targetPort: 27017
---
apiVersion: v1
kind: Endpoints
metadata:
  name: dev-mongo-read
  namespace: dev-db
subsets:
  - addresses:
      - ip: 0.0.0.0     # 외부 DB IP 주소 설정
    ports:
      - port: 27017
