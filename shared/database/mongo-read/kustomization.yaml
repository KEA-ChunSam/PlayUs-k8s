apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dev-db

resources:
  - dev-mongo-read.yaml
  - sealed-configmap.yaml

# kustomize build 혹은 kubectl apply -k . 시점에 IP가 자동으로 주입됨
replacements:
  - source:
      kind: ConfigMap
      name: mongo-read-config
      fieldPath: data.mongo-read-ip
    targets:
      - select:
          kind: Endpoints
          name: dev-mongo-read
        fieldPaths:
          - subsets[0].addresses[0].ip

generatorOptions:
  disableNameSuffixHash: true
