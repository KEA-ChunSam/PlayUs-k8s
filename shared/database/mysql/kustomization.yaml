apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dev-db

resources:
  - dev-mysql.yaml
  - sealed-configmap.yaml     # 이 파일은 자동으로 생성되는 파일이므로 직접 생성하지 않아도 됨

# kustomize build 혹은 kubectl apply -k . 시점에 IP가 자동으로 주입됨
replacements:
  - source:
      kind: ConfigMap
      name: mysql-config
      fieldPath: data.mysql-ip
    targets:
      - select:
          kind: Endpoints
          name: dev-mysql
        fieldPaths:
          - subsets[0].addresses[0].ip

generatorOptions:
  disableNameSuffixHash: true
