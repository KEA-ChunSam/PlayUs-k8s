apiVersion: v1
kind: Service
metadata:
  name: dev-mysql
  namespace: dev-db
spec:
  type: ClusterIP
  ports:
    - port: 3306
      targetPort: 3306
---
apiVersion: v1
kind: Endpoints
metadata:
  name: dev-mysql
  namespace: dev-db
subsets:
  - addresses:
      - ip: 0.0.0.0     # 외부 DB IP 주소 설정
    ports:
      - port: 3306
