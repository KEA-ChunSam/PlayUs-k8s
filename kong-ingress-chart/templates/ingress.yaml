apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "kong-ingress.name" . }}
  namespace: {{ .Values.namespace }}
  annotations:
    kubernetes.io/ingress.class: kong
    {{- if .Values.targetPath }}
    konghq.com/plugins: {{ include "kong-ingress.name" . }}-api-stripper
    {{- else }}
    konghq.com/strip-path: {{ .Values.stripPath | quote }}
    {{- end }}
    {{- if .Values.customAnnotations }}
    {{- toYaml .Values.customAnnotations | nindent 4 }}
    {{- end }}
spec:
  rules:
    - {{- if .Values.host }}
      host: {{ .Values.host }}
      {{- end }}
      http:
        paths:
          {{- range .Values.paths }}
          - path: {{ . }}
            pathType: {{ $.Values.pathType }}
            backend:
              service:
                name: {{ $.Values.service.name }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }} 