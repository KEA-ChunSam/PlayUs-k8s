namespace: dev-twp-service

service:
  name: twp-service
  port: 80

# 경로 설정 (rewrite는 Ingress level에서 처리)
paths:
  - path: /api/party
  - path: /api/chat
  - path: /api/twp/health

pathType: ImplementationSpecific

annotations:
  konghq.com/path-regex: "^/api/twp/(.*)$"
  konghq.com/rewrite: "/$1"
  