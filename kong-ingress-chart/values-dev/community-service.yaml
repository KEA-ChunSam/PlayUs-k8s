namespace: dev-community-service

service:
  name: community-service
  port: 80

# 경로 설정 (rewrite는 Ingress level에서 처리)
paths:
  - path: /api/post
  - path: /api/comment
  - path: /api/live-match-diary
  - path: /api/community/health

pathType: ImplementationSpecific

annotations:
  konghq.com/path-regex: "^/api/community/(.*)$"
  konghq.com/rewrite: "/$1"
