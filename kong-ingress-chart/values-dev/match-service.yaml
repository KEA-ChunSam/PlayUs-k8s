services:
  match-service:
    namespace: dev-match-service
    service:
      name: match-service
      port: 80
    paths:
      - path: /match
    pathType: Prefix
    stripPath: true

    # Kong 어노테이션 명시적 추가
    customAnnotations:
      konghq.com/strip-path: "true"
      konghq.com/preserve-host: "true"