# 네임스페이스 생성
apiVersion: v1
kind: Namespace
metadata:
  name: loadtest
  labels:
    name: loadtest

---
# k6 테스트 스크립트
apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-loadtest-script
  namespace: loadtest
data:
  load-test.js: |
    import http from 'k6/http';
    import { sleep, check, group } from 'k6';
    import { Rate, Trend, Counter } from 'k6/metrics';

    // 커스텀 메트릭 정의
    let errorRate = new Rate('error_rate');
    let responseTime = new Trend('response_time');
    let requestCount = new Counter('request_count');
    let authSuccessRate = new Rate('auth_success_rate');

    export let options = {
        scenarios: {
            // 웹 서버 부하 테스트 (쿠키 세션 포함)
            web_load_test: {
                executor: 'ramping-vus',
                startVUs: 0,
                stages: [
                    { duration: '30s', target: 3 },   // 웜업 (리소스 고려하여 축소)
                    { duration: '2m', target: 10 },   // 일반 부하
                    { duration: '1m', target: 20 },   // 중간 부하
                    { duration: '1m', target: 30 },   // 높은 부하
                    { duration: '30s', target: 40 },  // 피크 부하
                    { duration: '1m', target: 20 },   // 다운
                    { duration: '30s', target: 0 },   // 종료
                ],
                exec: 'webTest',
                tags: { test_type: 'web' },
            },
            // API 서버 부하 테스트 (인증 포함)
            api_load_test: {
                executor: 'ramping-vus',
                startVUs: 0,
                stages: [
                    { duration: '30s', target: 5 },   // 웜업
                    { duration: '2m', target: 15 },   // 일반 부하
                    { duration: '1m', target: 30 },   // 중간 부하
                    { duration: '1m', target: 50 },   // 높은 부하
                    { duration: '30s', target: 60 },  // 피크 부하
                    { duration: '1m', target: 30 },   // 다운
                    { duration: '30s', target: 0 },   // 종료
                ],
                exec: 'apiTest',
                tags: { test_type: 'api' },
            },
        },
        thresholds: {
            // 성능 임계값 설정 (401 응답 고려)
            'http_req_duration': ['p(95)<1500', 'p(99)<3000'],
            'http_req_failed{status:!401}': ['rate<0.10'], // 401 제외한 실패율 10% 이하
            'error_rate': ['rate<0.20'], // 인증 오류 포함하여 20% 이하
            'http_req_duration{test_type:web}': ['p(95)<2500'],
            'http_req_duration{test_type:api}': ['p(95)<1200'],
        },
        summaryTrendStats: ['avg', 'min', 'med', 'max', 'p(90)', 'p(95)', 'p(99)'],
    };

    // 가상 사용자별 쿠키 저장소
    let cookieJar = http.cookieJar();

    export function webTest() {
        group('Web Server Load Test', function () {
            let startTime = Date.now();
            
            // 쿠키를 자동으로 관리하여 세션 유지
            let response = http.get('https://web.playus.o-r.kr', {
                timeout: '30s',
                cookies: cookieJar,
                headers: {
                    'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
                    'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,image/apng,*/*;q=0.8',
                    'Accept-Language': 'ko-KR,ko;q=0.9,en;q=0.8',
                    'Accept-Encoding': 'gzip, deflate, br',
                    'Connection': 'keep-alive',
                    'Upgrade-Insecure-Requests': '1',
                    'Sec-Fetch-Dest': 'document',
                    'Sec-Fetch-Mode': 'navigate',
                    'Sec-Fetch-Site': 'none',
                    'Cache-Control': 'max-age=0',
                },
            });
            
            let duration = Date.now() - startTime;
            responseTime.add(duration);
            requestCount.add(1);
            
            let success = check(response, {
                'web: status is 200': (r) => r.status === 200,
                'web: response time < 5s': (r) => r.timings.duration < 5000,
                'web: body contains content': (r) => r.body && r.body.length > 0,
                'web: no server errors': (r) => r.status < 500,
                'web: has session cookie': (r) => {
                    let cookies = r.headers['Set-Cookie'] || r.headers['set-cookie'];
                    return cookies !== undefined;
                },
            });
            
            if (!success) {
                errorRate.add(1);
                console.error(`Web test failed: ${response.status} - ${response.status_text}`);
            }
        });
        
        sleep(Math.random() * 3 + 2); // 2-5초 랜덤 대기 (부하 분산)
    }

    export function apiTest() {
        group('API Server Load Test', function () {
            let startTime = Date.now();
            
            let response = http.get('https://api.playus.o-r.kr/user/user/profile', {
                timeout: '20s',
                cookies: cookieJar,
                headers: {
                    'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
                    'Accept': 'application/json, text/plain, */*',
                    'Accept-Language': 'ko-KR,ko;q=0.9,en;q=0.8',
                    'Accept-Encoding': 'gzip, deflate, br',
                    'Connection': 'keep-alive',
                    'Referer': 'https://web.playus.o-r.kr/',
                    'Sec-Fetch-Dest': 'empty',
                    'Sec-Fetch-Mode': 'cors',
                    'Sec-Fetch-Site': 'same-site',
                    'X-Requested-With': 'XMLHttpRequest',
                },
            });
            
            let duration = Date.now() - startTime;
            responseTime.add(duration);
            requestCount.add(1);
            
            let success = check(response, {
                'api: status is 200 or 401': (r) => r.status === 200 || r.status === 401,
                'api: response time < 2s': (r) => r.timings.duration < 2000,
                'api: valid JSON or auth error': (r) => {
                    if (r.status === 401) {
                        authSuccessRate.add(0);
                        return true;
                    }
                    try {
                        JSON.parse(r.body);
                        authSuccessRate.add(1);
                        return true;
                    } catch (e) {
                        return false;
                    }
                },
                'api: no server errors': (r) => r.status < 500,
            });
            
            if (!success && response.status !== 401) {
                errorRate.add(1);
                console.error(`API test failed: ${response.status} - ${response.status_text}`);
            }
            
            if (response.status === 401 && Math.random() < 0.05) {
                console.log(`API 인증 필요: ${response.status} (정상적인 응답)`);
            }
        });
        
        sleep(Math.random() * 2 + 1); // 1-3초 랜덤 대기
    }

    export function handleSummary(data) {
        console.log('\n=== 부하 테스트 결과 요약 ===');
        console.log(`총 요청 수: ${data.metrics.http_reqs.values.count}`);
        console.log(`실패율: ${(data.metrics.http_req_failed.values.rate * 100).toFixed(2)}%`);
        console.log(`인증 성공율: ${(data.metrics.auth_success_rate.values.rate * 100).toFixed(2)}%`);
        console.log(`평균 응답시간: ${data.metrics.http_req_duration.values.avg.toFixed(2)}ms`);
        console.log(`95퍼센타일 응답시간: ${data.metrics.http_req_duration.values['p(95)'].toFixed(2)}ms`);
        console.log(`최대 응답시간: ${data.metrics.http_req_duration.values.max.toFixed(2)}ms`);
        console.log('========================\n');
        
        return {
            'stdout': JSON.stringify(data, null, 2),
        };
    }

---
# 부하 테스트 실행을 위한 Job
apiVersion: batch/v1
kind: Job
metadata:
  name: k6-loadtest-job
  namespace: loadtest
  labels:
    app: k6-loadtest
spec:
  template:
    metadata:
      labels:
        app: k6-loadtest
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:latest
          command:
            - k6
            - run
            - --out
            - json=/results/test-results.json
            - --summary-export=/results/summary.json
            - --console-output=/results/console.log
            - /scripts/load-test.js
          volumeMounts:
            - name: k6-script
              mountPath: /scripts
            - name: test-results
              mountPath: /results
          resources:
            requests:
              memory: "200Mi"
              cpu: "150m"
            limits:
              memory: "800Mi"
              cpu: "800m"
          env:
            - name: K6_NO_CONNECTION_REUSE
              value: "false"
            - name: K6_NO_VU_CONNECTION_REUSE
              value: "false"
            - name: K6_SHOW_CLOUD_LOGS
              value: "false"
            - name: K6_HTTP_DEBUG
              value: "false"
        # 결과 수집을 위한 사이드카 컨테이너
        - name: result-collector
          image: busybox:1.35
          command: ['sh', '-c']
          args:
            - |
              echo "=== k6 부하 테스트 결과 수집기 시작 ==="
              while true; do
                if [ -f /results/test-results.json ]; then
                  echo "결과 파일 발견! 마지막 50줄 출력:"
                  tail -n 50 /results/test-results.json
                  echo "=== 콘솔 로그 ==="
                  if [ -f /results/console.log ]; then
                    cat /results/console.log
                  fi
                  break
                fi
                echo "결과 파일 대기 중... (10초 후 재시도)"
                sleep 10
              done
              echo "결과 수집 완료"
              sleep 1800  # 30분 대기 (결과 확인용)
          volumeMounts:
            - name: test-results
              mountPath: /results
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "64Mi"
              cpu: "50m"
      volumes:
        - name: k6-script
          configMap:
            name: k6-loadtest-script
        - name: test-results
          emptyDir: {}
      # 특정 노드에 배치 (필요시)
      nodeSelector:
        kubernetes.io/os: linux
  backoffLimit: 2
  activeDeadlineSeconds: 900  # 15분 타임아웃
