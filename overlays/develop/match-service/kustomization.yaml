apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/match-service

patches:
  - path: patch-image.yaml

secretGenerator:
  - name: match-db-secret
    envs:
      - .env.secret
    namespace: match-service

generatorOptions:
  disableNameSuffixHash: true

namePrefix: dev-
