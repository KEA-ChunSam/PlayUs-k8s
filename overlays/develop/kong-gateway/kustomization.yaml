# overlays/develop/kong-gateway/kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: msa-dev

resources:
  - ../../../base/kong-gateway
  - ../../../shared/database/postgres-kong

# 개발 환경용 Kong 설정으로 교체
configMapGenerator:
  - name: kong-declarative-config
    behavior: replace
    files:
      - kong.yaml=kong-dev.yaml

# 개발 환경용 시크릿 생성
secretGenerator:
  - name: kong-secrets
    literals:
      - postgres-password=dev-kong-password

# Kong Control Plane URL을 개발 환경용으로 패치
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: kong-cp
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: kong-cp
      spec:
        template:
          spec:
            containers:
              - name: kong
                env:
                  - name: KONG_ADMIN_GUI_URL
                    value: http://kong-admin.dev.example.com:8002
                  - name: KONG_ADMIN_GUI_API_URL
                    value: http://kong-admin.dev.example.com:8001
                  - name: KONG_LOG_LEVEL
                    value: debug
                  - name: KONG_ADMIN_GUI_AUTH
                    value: basic-auth
                  - name: KONG_ENFORCE_RBAC
                    value: "off"



  # Data Plane에 개발 환경 설정 추가
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: kong-dp
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: KONG_LOG_LEVEL
          value: "debug"

  # 개발 환경용 LoadBalancer를 NodePort로 변경
  - target:
      version: v1
      kind: Service
      name: kong-proxy
    patch: |-
      - op: replace
        path: /spec/type
        value: "NodePort"
      - op: add
        path: /spec/ports/0/nodePort
        value: 30080
      - op: add
        path: /spec/ports/1/nodePort
        value: 30443

  # PostgreSQL 개발 환경 설정
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: postgres-kong
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: POSTGRES_MAX_CONNECTIONS
          value: "200"

  # 개발 환경용 PVC 크기 조정
  - target:
      version: v1
      kind: PersistentVolumeClaim
      name: postgres-kong-pvc
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: "5Gi"

namePrefix: dev-
labels:
  - pairs:
      environment: development
      project: msa-gateway