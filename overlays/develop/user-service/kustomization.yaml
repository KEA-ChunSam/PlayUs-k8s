apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/user-service
  - sealed-secret.yaml

patches:
  - path: patch-image.yaml
  - target:
      kind: SealedSecret
      name: user-db-secret
    patch: |-
        apiVersion: bitnami.com/v1alpha1
        kind: SealedSecret
        metadata:
          name: user-db-secret  # prefix 무효화

#secretGenerator:
#  - name: user-db-secret
#    envs:
#      - .env.secret
#    namespace: user-service

generatorOptions:
  disableNameSuffixHash: true

namePrefix: dev-
