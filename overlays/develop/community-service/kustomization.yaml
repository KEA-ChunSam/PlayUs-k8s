apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/community-service

patches:
  - path: patch-image.yaml

secretGenerator:
  - name: community-db-secret
    envs:
      - .env.secret
    namespace: community-service

generatorOptions:
  disableNameSuffixHash: true

namePrefix: dev-
