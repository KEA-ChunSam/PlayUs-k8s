apiVersion: apps/v1
kind: Deployment
metadata:
  name: community-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: community-service
  template:
    metadata:
      labels:
        app: community-service
    spec:
      containers:
        - name: community-service
          image: yukyung0/playus-community-service:dev