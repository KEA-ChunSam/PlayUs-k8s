apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev-redis-rank
  namespace: dev-search-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dev-redis-rank
  template:
    metadata:
      labels:
        app: dev-redis-rank
    spec:
      containers:
        - name: redis
          image: redis:7.2
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
              