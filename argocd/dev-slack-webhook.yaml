apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: slack-webhook-ingress
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/KEA-ChunSam/PlayUs-k8s.git
    targetRevision: HEAD
    path: kong-ingress-chart
    helm:
      releaseName: slack-webhook-ingress
      valueFiles:
        - values-dev/slack-webhook.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: 'dev-gateway'  # Kong Ingress Controller가 있는 네임스페이스
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
