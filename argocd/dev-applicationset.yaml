apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: dev-playus-applicationset
  namespace: argocd
spec:
  generators:                           # 어떤 기준으로 application을 생성할지 정의
    - list:                             # 고정된 리스트 기반으로 생성
        elements:
          - name: dev-user-service
            path: overlays/develop/user-service
          - name: dev-community-service
            path: overlays/develop/community-service
          - name: dev-search-service
            path: overlays/develop/search-service
          - name: dev-match-service
            path: overlays/develop/match-service
          - name: dev-twp-service
            path: overlays/develop/twp-service
#          - name: dev-monitoring
#            path: overlays/develop/monitoring
  template:
    metadata:
      name: '{{name}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/KEA-ChunSam/PlayUs-k8s.git
        targetRevision: HEAD
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{name}}'          # MSA 서비스마다 전용 네임스페이스
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - RespectIgnoreDifferences=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
