apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-ingress
  namespace: argocd
  labels:
    environment: dev
spec:
  project: default
  source:
    repoURL: https://github.com/KEA-ChunSam/PlayUs-k8s.git
    targetRevision: HEAD
    path: 'kong-ingress-chart'
    helm:
      releaseName: 'dev-ingress'
      valueFiles:
        - 'values.yaml'
        - 'values-dev/community-service.yaml'
        - 'values-dev/match-service.yaml'
        - 'values-dev/search-service.yaml'
        - 'values-dev/twp-service.yaml'
        - 'values-dev/user-service.yaml'
  destination:
    server: 'https://kubernetes.default.svc'
  # namespace는 각 ingress의 metadata.namespace에서 개별 설정
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true  # 대용량 리소스 처리 개선
  ignoreDifferences:
    - group: networking.k8s.io
      kind: Ingress
      jsonPointers:
        - /status
