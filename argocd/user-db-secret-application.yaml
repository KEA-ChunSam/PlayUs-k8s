apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: user-db-secret
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/KEA-ChunSam/PlayUs-k8s.git
    targetRevision: HEAD
    path: overlays/develop/user-service/sealed-secret  # 새로 만든 디렉토리
  destination:
    server: https://kubernetes.default.svc
    namespace: user-service
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
